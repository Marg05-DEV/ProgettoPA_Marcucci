services:
  db:
    image: postgres:16
    container_name: postgres_progetto_pa
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
  app:
    build: .
    container_name: app_progetto_pa
    ports:
      - "${APP_PORT}:3000"
    env_file:
      - .env
    depends_on:
      - db


volumes:
  postgres_data: